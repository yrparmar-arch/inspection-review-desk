<style>
:root{--blue:#00049E;--bg:#F7F9FA;--line:#DEE0E0;--ink:#222;--muted:#727273;--btn:#706F6F}

button{margin-top:14px;width:100%;padding:10px;background:var(--btn);color:#fff;border:0;border-radius:2px;font:inherit;cursor:pointer}
.err{color:#c0281f;font-size:13px;min-height:18px;margin-top:8px}.note{color:var(--muted);font-size:12px;margin-top:14px}
